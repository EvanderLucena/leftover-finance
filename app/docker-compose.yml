# Leftover Finance no Docker: o app com login próprio, aberto na rede de casa (HTTP).
# Primeira vez: rode `docker compose up -d`, veja o código de instalação com `docker compose logs app`
# e abra http://IP-DESTE-COMPUTADOR:4321 no navegador para criar usuário e senha.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      FINANCA_DB: /data/financas.db
      PORT: 4321
      FINANCA_HOST: 0.0.0.0           # dentro do container; quem limita o acesso é a linha "ports" abaixo
      FINANCA_ENDERECO: ${FINANCA_ENDERECO:-}
      # chave da AUVP: cofre no volume persistente (arquivo só do usuário, permissão 600)
      FINFLOW_COFRE: /data/cofre
      AUVP_KEY: ${AUVP_KEY:-}
    volumes:
      - ./data:/data
    ports:
      # casa toda: "4321:4321". Só esta máquina: "127.0.0.1:4321:4321"
      - "${PORTA:-4321}:4321"
